name: skeleton
description: Color-matched skeleton loading widgets for Flutter that match the color of the content they replace.
version: 0.0.1
homepage: https://github.com/karloows/skeleton
repository: https://github.com/karloows/skeleton
issue_tracker: https://github.com/karloows/skeleton/issues

environment:
  sdk: ^3.10.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - flutter
  - loading
  - skeleton
  - shimmer
  - placeholder

screenshots:
  - description: Skeleton loading demo showing color-matched bones.
    path: demo/record.gif
